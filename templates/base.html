<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock title %} | Portfolio</title>
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">
  
  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md shadow z-50">
    <div class="container mx-auto flex justify-between items-center py-4 px-6">
      <a href="/" class="text-xl font-bold text-indigo-600">R MADHUSUDHANA</a>
      <ul class="flex space-x-6 font-medium">
        <li><a href="/" class="{% block homeactive %}{% endblock homeactive %} hover:text-indigo-600">Home</a></li>
        <li><a href="/about" class="{% block aboutactive %}{% endblock aboutactive %} hover:text-indigo-600">About</a></li>
        <li><a href="/projects" class="{% block projectsactive %}{% endblock projectsactive %} hover:text-indigo-600">Projects</a></li>
        <li><a href="/contact" class="{% block contactactive %}{% endblock contactactive %} hover:text-indigo-600">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="flex-grow pt-20">
    {% block body %}{% endblock body %}
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 py-6">
    <div class="container mx-auto text-center">
      <p>&copy; {{ now|date:"Y" }} R Madhusudhana. All rights reserved.</p>
      <div class="flex justify-center space-x-6 mt-3">
        <a href="https://github.com/Madhusudhana7259" target="_blank" class="hover:text-indigo-400">GitHub</a>
        <a href="https://linkedin.com" target="_blank" class="hover:text-indigo-400">LinkedIn</a>
        <a href="mailto:your@email.com" class="hover:text-indigo-400">Email</a>
      </div>
    </div>
  </footer>

  <script>AOS.init({ duration: 1000, once: true });</script>
</body>
</html>
